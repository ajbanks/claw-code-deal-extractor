[package]
name = "deal-extractor"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
api = { path = "../api" }
base64 = "0.22"
calamine = "0.26"
jsonschema = "0.53"
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true

[[bin]]
name = "deal-extractor"
path = "src/main.rs"
